services:
  netpulse:
    build: .
    container_name: netpulse
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - PORT=4000
    volumes:
      - netpulse-data:/app/backend/data
    networks:
      - netpulse-internal
      - webproxy_network
    restart: unless-stopped

volumes:
  netpulse-data:

networks:
  netpulse-internal:
    driver: bridge
  webproxy_network:
    external: true